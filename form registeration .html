<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cake Order Registration</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:linear-gradient(to right,#ff9a9e,#fad0c4);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            width:400px;
            padding:30px;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        .container h2{
            text-align:center;
            color:#d63384;
            margin-bottom:20px;
        }

        .form-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        textarea{
            resize:none;
        }

        .btn{
            width:100%;
            padding:12px;
            border:none;
            background:#ff69b4;
            color:white;
            font-size:16px;
            border-radius:8px;
            cursor:pointer;
        }

        .btn:hover{
            background:#d63384;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>🍰 Cake Order Registration</h2>

    <form>

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter mobile number" required>
        </div>

        <div class="form-group">
            <label for="cake">Select Cake</label>
            <select id="cake">
                <option>Chocolate Cake</option>
                <option>Red Velvet Cake</option>
                <option>Strawberry Cake</option>
                <option>Black Forest Cake</option>
                <option>Cookies</option>
            </select>
        </div>

        <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" min="1" placeholder="Enter quantity">
        </div>

        <div class="form-group">
            <label for="address">Delivery Address</label>
            <textarea id="address" rows="4" placeholder="Enter delivery address"></textarea>
        </div>

        <button type="submit" class="btn">
            Place Order
        </button>

    </form>
</div>

</body>
</html>
